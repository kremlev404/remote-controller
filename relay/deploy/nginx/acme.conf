# Step 1 of the nginx setup: only answers Let's Encrypt on port 80,
# so certbot can issue the first certificate. relay.conf replaces it.
server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 503;
    }
}
