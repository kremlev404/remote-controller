# nginx in front of the relay. Replace RELAY_DOMAIN (deploy.sh does it).
# Certificate: certbot certonly --webroot -w /var/www/certbot -d RELAY_DOMAIN
# The relay itself listens on 127.0.0.1:8080 (systemd unit sets HOST=127.0.0.1).

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream remote_controller_relay {
    server 127.0.0.1:8080;
    keepalive 16;
}

server {
    listen 80;
    listen [::]:80;
    server_name RELAY_DOMAIN;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    # "listen ... http2" works on every nginx still in support (1.18+); 1.25+ only warns.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name RELAY_DOMAIN;

    ssl_certificate     /etc/letsencrypt/live/RELAY_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/RELAY_DOMAIN/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:relay_tls:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # The relay sets HSTS, CSP and the other page headers itself.
    server_tokens off;
    client_max_body_size 1m;

    # The PC's control socket and every browser session are long-lived websockets.
    location /relay/ {
        proxy_pass http://remote_controller_relay;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        # Overwrite, never append: the relay rate-limits by the first address in this header.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
        proxy_buffering off;
    }

    location / {
        proxy_pass http://remote_controller_relay;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
