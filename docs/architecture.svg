<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 920" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#475569"/>
    </marker>
    <marker id="v" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#7c3aed"/>
    </marker>
    <marker id="g" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#16a34a"/>
    </marker>
  </defs>
  <rect width="1000" height="920" fill="#ffffff"/>

  <text x="30" y="32" font-size="18" font-weight="700" fill="#0f172a">Architecture and security</text>

  <!-- LAN -->
  <rect x="10" y="48" width="980" height="372" rx="14" fill="#f0fdf4" stroke="#16a34a" stroke-dasharray="6 4"/>
  <text x="26" y="70" font-weight="700" fill="#14532d">Home network (private LAN)</text>

  <rect x="30" y="90" width="220" height="84" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="116" text-anchor="middle" font-weight="700" fill="#0c4a6e">Phone app</text>
  <text x="140" y="136" text-anchor="middle" font-size="12" fill="#0c4a6e">Android · iOS (Compose MP)</text>
  <text x="140" y="156" text-anchor="middle" font-size="12" fill="#0c4a6e">optional CA fingerprint pin</text>

  <rect x="30" y="210" width="220" height="84" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="236" text-anchor="middle" font-weight="700" fill="#0c4a6e">Browser on the LAN</text>
  <text x="140" y="256" text-anchor="middle" font-size="12" fill="#0c4a6e">page served by the PC at /web</text>
  <text x="140" y="276" text-anchor="middle" font-size="12" fill="#0c4a6e">warns unless the local CA is trusted</text>

  <!-- PC -->
  <rect x="600" y="80" width="370" height="320" rx="12" fill="#ffffff" stroke="#16a34a" stroke-width="1.5"/>
  <text x="785" y="104" text-anchor="middle" font-weight="700" fill="#14532d">PC · desktop app (Compose Desktop)</text>

  <rect x="620" y="116" width="330" height="50" rx="8" fill="#dcfce7" stroke="#16a34a"/>
  <text x="785" y="137" text-anchor="middle" fill="#14532d">HTTPS / WSS :8765 on the private LAN IP</text>
  <text x="785" y="155" text-anchor="middle" font-size="11" fill="#14532d">leaf certificate from the local CA (LAN names only)</text>

  <rect x="620" y="176" width="330" height="96" rx="8" fill="#fef9c3" stroke="#ca8a04"/>
  <text x="785" y="196" text-anchor="middle" font-weight="700" fill="#713f12">LinkGate · admission</text>
  <text x="785" y="216" text-anchor="middle" font-size="11" fill="#713f12">private address only · same Origin · 10 s handshake limit</text>
  <text x="785" y="234" text-anchor="middle" font-size="11" fill="#713f12">8 handshakes at once · 5 failures → 5 min block</text>
  <text x="785" y="252" text-anchor="middle" font-size="11" fill="#713f12">access code, or Allow dialog with a check number</text>

  <rect x="620" y="282" width="330" height="50" rx="8" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="785" y="303" text-anchor="middle" font-size="13" fill="#334155">/ws commands · /stream screen · /web/ws clipboard</text>
  <text x="785" y="321" text-anchor="middle" font-size="11" fill="#334155">→ keyboard, mouse, volume, screen capture</text>

  <rect x="620" y="342" width="330" height="46" rx="8" fill="#ede9fe" stroke="#7c3aed"/>
  <text x="785" y="362" text-anchor="middle" fill="#4c1d95">RelayLink · outgoing only, off by default</text>
  <text x="785" y="379" text-anchor="middle" font-size="11" fill="#4c1d95">device key P-256 · ID = hash(public key)</text>

  <!-- LAN arrows -->
  <line x1="252" y1="132" x2="616" y2="138" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="434" y="124" text-anchor="middle" font-size="12" fill="#334155">wss://192.168.x.x:8765 · TLS</text>

  <line x1="252" y1="250" x2="616" y2="158" stroke="#475569" stroke-width="1.5" marker-end="url(#a)"/>
  <text x="430" y="232" text-anchor="middle" font-size="12" fill="#334155">https / wss :8765/web</text>

  <!-- Internet -->
  <text x="26" y="462" font-weight="700" fill="#334155">Internet</text>

  <rect x="30" y="500" width="220" height="84" rx="10" fill="#e0f2fe" stroke="#0284c7"/>
  <text x="140" y="526" text-anchor="middle" font-weight="700" fill="#0c4a6e">Browser anywhere</text>
  <text x="140" y="546" text-anchor="middle" font-size="12" fill="#0c4a6e">page served by the relay</text>
  <text x="140" y="566" text-anchor="middle" font-size="12" fill="#0c4a6e">no certificate warning</text>

  <rect x="340" y="480" width="340" height="180" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="510" y="504" text-anchor="middle" font-weight="700" fill="#4c1d95">Relay (self-hosted, :relay)</text>
  <rect x="355" y="514" width="310" height="30" rx="6" fill="#ede9fe" stroke="#a78bfa"/>
  <text x="510" y="534" text-anchor="middle" font-size="12" fill="#4c1d95">TLS proxy · public certificate (Let's Encrypt)</text>
  <text x="510" y="566" text-anchor="middle" font-size="12" fill="#4c1d95">ID registry: signed challenge, ID = hash(key)</text>
  <text x="510" y="586" text-anchor="middle" font-size="12" fill="#4c1d95">pipes sessions frame by frame, ciphertext only</text>
  <text x="510" y="606" text-anchor="middle" font-size="12" fill="#4c1d95">Origin check · rate limits · 16 tunnels per PC</text>
  <text x="510" y="626" text-anchor="middle" font-size="12" fill="#4c1d95">serves the web page (HSTS, frame-ancestors none)</text>

  <line x1="252" y1="542" x2="336" y2="542" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#v)"/>
  <text x="294" y="532" text-anchor="middle" font-size="11" fill="#4c1d95">https / wss</text>

  <path d="M785 390 V560 H684" fill="none" stroke="#7c3aed" stroke-width="1.5" marker-end="url(#v)"/>
  <text x="797" y="452" font-size="12" fill="#4c1d95">outgoing wss through NAT</text>
  <text x="797" y="470" font-size="11" fill="#4c1d95">no port forwarding</text>
  <text x="797" y="488" font-size="11" fill="#4c1d95">/relay/host + /relay/accept/{session}</text>

  <!-- end to end -->
  <path d="M140 586 V700 H900 V402" fill="none" stroke="#16a34a" stroke-width="2" stroke-dasharray="7 5" marker-end="url(#g)"/>
  <text x="520" y="692" text-anchor="middle" font-size="12" fill="#14532d">end-to-end link v2 through the pipe: the relay never holds a key</text>

  <!-- layers -->
  <text x="30" y="750" font-weight="700" fill="#0f172a">Three layers on every connection</text>

  <rect x="30" y="764" width="300" height="130" rx="10" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="46" y="788" font-weight="700" fill="#334155">1 · Transport (TLS)</text>
  <text x="46" y="812" font-size="12" fill="#334155">LAN: local CA, name-constrained to</text>
  <text x="46" y="832" font-size="12" fill="#334155">private IPs, localhost and .local</text>
  <text x="46" y="852" font-size="12" fill="#334155">Relay: public certificate + HSTS</text>
  <text x="46" y="872" font-size="12" fill="#334155">Phone: optional CA fingerprint pin</text>

  <rect x="350" y="764" width="300" height="130" rx="10" fill="#fefce8" stroke="#ca8a04"/>
  <text x="366" y="788" font-weight="700" fill="#713f12">2 · Admission (LinkGate)</text>
  <text x="366" y="812" font-size="12" fill="#713f12">private address · same Origin</text>
  <text x="366" y="832" font-size="12" fill="#713f12">time limit · throttle · handshake cap</text>
  <text x="366" y="852" font-size="12" fill="#713f12">access code, or Allow on the PC</text>
  <text x="366" y="872" font-size="12" fill="#713f12">Allow → grant for the device's other sockets</text>

  <rect x="670" y="764" width="300" height="130" rx="10" fill="#f0fdf4" stroke="#16a34a"/>
  <text x="686" y="788" font-weight="700" fill="#14532d">3 · Link v2 (end to end)</text>
  <text x="686" y="812" font-size="12" fill="#14532d">ephemeral ECDH P-256 per socket</text>
  <text x="686" y="832" font-size="12" fill="#14532d">HKDF salt = code, grant key, or none</text>
  <text x="686" y="852" font-size="12" fill="#14532d">AES-256-GCM, one key per direction</text>
  <text x="686" y="872" font-size="12" fill="#14532d">sequence numbers stop replays</text>
</svg>
