<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 372" font-family="-apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="Four steps: start the PC app, join the same Wi-Fi, connect from the phone app or a browser, then control the PC.">
  <title>How to use Remote Controller in four steps</title>
  <defs>
    <marker id="next" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0L10 5L0 10z" fill="#2e7d32"/>
    </marker>
  </defs>
  <rect width="1200" height="372" rx="18" fill="#ffffff"/>

  <!-- Step 1 -->
  <g transform="translate(24 24)">
    <rect width="258" height="324" rx="16" fill="#f4f4f5" stroke="#e2e2e6"/>
    <circle cx="36" cy="36" r="18" fill="#2e7d32"/>
    <text x="36" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">1</text>
    <text x="66" y="42" font-size="18" font-weight="700" fill="#141416">Start the PC app</text>
    <rect x="54" y="80" width="150" height="96" rx="8" fill="#141416"/>
    <rect x="61" y="87" width="136" height="82" rx="3" fill="#ffffff"/>
    <text x="129" y="112" text-anchor="middle" font-size="10" fill="#5e5e66">Address</text>
    <text x="129" y="127" text-anchor="middle" font-size="12" font-weight="700" fill="#141416">192.168.1.20:8765</text>
    <text x="129" y="146" text-anchor="middle" font-size="10" fill="#5e5e66">Access code</text>
    <text x="129" y="160" text-anchor="middle" font-size="12" font-weight="700" fill="#2e7d32">XXXX-XXXX-XXXX</text>
    <path d="M36 182h186l10 12H26z" fill="#3f3f46"/>
    <text x="129" y="234" text-anchor="middle" font-size="15" fill="#141416">It shows an address</text>
    <text x="129" y="256" text-anchor="middle" font-size="15" fill="#141416">and an access code.</text>
    <text x="129" y="292" text-anchor="middle" font-size="13" fill="#5e5e66">No account, no sign-up.</text>
  </g>

  <!-- Step 2 -->
  <g transform="translate(316 24)">
    <rect width="258" height="324" rx="16" fill="#f4f4f5" stroke="#e2e2e6"/>
    <circle cx="36" cy="36" r="18" fill="#2e7d32"/>
    <text x="36" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">2</text>
    <text x="66" y="42" font-size="18" font-weight="700" fill="#141416">Join the same Wi-Fi</text>
    <g fill="none" stroke="#2e7d32" stroke-linecap="round" stroke-width="9">
      <path d="M69 128a86 86 0 0 1 120 0"/>
      <path d="M89 149a58 58 0 0 1 80 0"/>
      <path d="M109 170a30 30 0 0 1 40 0"/>
    </g>
    <circle cx="129" cy="187" r="8" fill="#2e7d32"/>
    <text x="129" y="234" text-anchor="middle" font-size="15" fill="#141416">Put the phone on the</text>
    <text x="129" y="256" text-anchor="middle" font-size="15" fill="#141416">same network as the PC.</text>
    <text x="129" y="292" text-anchor="middle" font-size="13" fill="#5e5e66">Away from home? Use a relay.</text>
  </g>

  <!-- Step 3 -->
  <g transform="translate(608 24)">
    <rect width="258" height="324" rx="16" fill="#f4f4f5" stroke="#e2e2e6"/>
    <circle cx="36" cy="36" r="18" fill="#2e7d32"/>
    <text x="36" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">3</text>
    <text x="66" y="42" font-size="18" font-weight="700" fill="#141416">Connect</text>
    <rect x="94" y="72" width="70" height="128" rx="12" fill="#141416"/>
    <rect x="100" y="80" width="58" height="112" rx="6" fill="#ffffff"/>
    <rect x="107" y="104" width="44" height="20" rx="5" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="129" y="118" text-anchor="middle" font-size="9" fill="#5e5e66">Address</text>
    <rect x="107" y="130" width="44" height="20" rx="5" fill="#f4f4f5" stroke="#d4d4d8"/>
    <text x="129" y="144" text-anchor="middle" font-size="9" fill="#5e5e66">Code</text>
    <rect x="107" y="158" width="44" height="20" rx="10" fill="#2e7d32"/>
    <text x="129" y="172" text-anchor="middle" font-size="9" font-weight="700" fill="#ffffff">Connect</text>
    <text x="129" y="234" text-anchor="middle" font-size="15" fill="#141416">Open the phone app or</text>
    <text x="129" y="256" text-anchor="middle" font-size="15" fill="#141416">a browser, type the code.</text>
    <text x="129" y="292" text-anchor="middle" font-size="13" fill="#5e5e66">Only the first time on each device.</text>
  </g>

  <!-- Step 4 -->
  <g transform="translate(900 24)">
    <rect width="276" height="324" rx="16" fill="#e5f3e6" stroke="#2e7d32"/>
    <circle cx="36" cy="36" r="18" fill="#2e7d32"/>
    <text x="36" y="42" text-anchor="middle" font-size="17" font-weight="700" fill="#ffffff">4</text>
    <text x="66" y="42" font-size="18" font-weight="700" fill="#0e3b14">Sit back</text>
    <rect x="50" y="76" width="176" height="104" rx="6" fill="#141416"/>
    <path d="M124 104l42 24-42 24z" fill="#81c784"/>
    <rect x="124" y="180" width="28" height="9" fill="#141416"/>
    <rect x="98" y="189" width="80" height="5" rx="2" fill="#141416"/>
    <text x="138" y="234" text-anchor="middle" font-size="15" fill="#0e3b14">Volume, playback, mouse,</text>
    <text x="138" y="256" text-anchor="middle" font-size="15" fill="#0e3b14">keyboard, live screen.</text>
    <text x="138" y="292" text-anchor="middle" font-size="13" fill="#2e7d32">Next time it just connects.</text>
  </g>

  <g fill="none" stroke="#2e7d32" stroke-width="3" marker-end="url(#next)">
    <path d="M284 186h28"/>
    <path d="M576 186h28"/>
    <path d="M868 186h28"/>
  </g>
</svg>
