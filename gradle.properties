org.gradle.jvmargs=-Xmx8192m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=false

kotlin.code.style=official

# Apple targets are part of the client. Kotlin/Native compiles them on macOS;
# on other hosts those targets are skipped so the Android build still runs.
kotlin.native.ignoreDisabledTargets=true
android.useAndroidX=true
android.nonTransitiveRClass=true

# Optional: full JDK 21 with jpackage for desktop packaging (see local.properties.example)
# desktop.jdk.home=C\:\\Program Files\\Eclipse Adoptium\\jdk-21.0.6.7-hotspot

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
